<div class="paginacion">
  <p class="paginacion__rango">
    @if (totalElementos() === 0) {
      Sin elementos
    } @else {
      <span class="paginacion__rango-numeros">{{ desde() }}–{{ hasta() }}</span>
      de {{ totalElementos() }}
    }
  </p>

  <div class="paginacion__controles">
    <span class="paginacion__indicador">
      Página {{ pagina() + 1 }} de {{ totalPaginas() || 1 }}
    </span>
    <div class="paginacion__botones">
      <button
        type="button"
        class="paginacion__nav"
        [disabled]="enPrimera()"
        aria-label="Página anterior"
        (click)="anterior()">
        <svg viewBox="0 0 24 24" fill="none" class="paginacion__icono" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <button
        type="button"
        class="paginacion__nav"
        [disabled]="enUltima()"
        aria-label="Página siguiente"
        (click)="siguiente()">
        <svg viewBox="0 0 24 24" fill="none" class="paginacion__icono" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
      </button>
    </div>
  </div>
</div>
