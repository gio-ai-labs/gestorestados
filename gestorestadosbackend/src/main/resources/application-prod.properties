# =============================================================================
# application-prod.properties  (perfil PROD)
# Valores reales hardcodeados. Ajustar URL/credenciales cuando exista un
# servidor de produccion distinto al de desarrollo.
# =============================================================================

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/gio
spring.datasource.username=sa
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP (pool razonable para prod) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- Logging ---
logging.level.com.gio.gestorestados=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

# --- CORS prod ---
app.cors.allowed-origins=http://localhost:4200
