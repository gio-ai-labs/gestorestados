# =============================================================================
# application-dev.properties  (perfil DEV)
# Datasource PostgreSQL de desarrollo (credenciales del MCP gio-mcp-postgres-dba).
# Valores reales hardcodeados para dev.
# =============================================================================

# --- Datasource (PostgreSQL 17, esquema gestorestados) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/gio
spring.datasource.username=sa
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# El esquema ya existe (V1__esquema_gestorestados.sql aplicado): validar contra el.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Logging ---
logging.level.com.gio.gestorestados=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO

# --- CORS dev ---
app.cors.allowed-origins=http://localhost:4200,http://localhost:4300,http://localhost:5173
