# =============================================================================
# application.properties  (config COMUN + selector de perfil)
# Gestor de Estados
# =============================================================================
spring.application.name=gestorestados

# Context-path: toda la app cuelga de /gestorestados
# (coincide con el finalName del .war, igual en standalone y desplegado).
# Endpoints REST -> /gestorestados/api/v1/...  ·  Swagger -> /gestorestados/swagger-ui.html
server.servlet.context-path=/gestorestados

# Selector de perfil (cambiar a 'prod' para el perfil de produccion)
spring.profiles.active=dev

# --- JPA / Hibernate (comun) ---
# Evita "open session in view" para no mantener transacciones abiertas en la vista.
spring.jpa.open-in-view=false
# Esquema fisico por defecto (todas las entidades viven en gestorestados).
spring.jpa.properties.hibernate.default_schema=gestorestados
# Naming fisico estandar: camelCase (Java) -> snake_case (DB).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# --- OpenAPI / Swagger UI (springdoc) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# --- CORS (origenes permitidos; sobrescribir por perfil/entorno) ---
app.cors.allowed-origins=http://localhost:4200
